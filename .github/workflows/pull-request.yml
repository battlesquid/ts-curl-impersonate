name: pr checks

on:
    pull_request:
        types: [opened, reopened, edited, synchronize]
        branches:
            - master

jobs:
    neat:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: jdx/mise-action@v4
            - run: pnpm i
            - run: pnpm neat
